      doi: not found
      acquiredFrom: "2011-03-18"
      acquiredTo: "2011-05-06"
      published: not found
      gridSpacing: "1.01 m"
      realDetail: "About 3 to 5 m"   # docs/CONFIDENCE.md section 6, as for the Jezero HiRISE terrain
