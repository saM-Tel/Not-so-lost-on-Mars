# WHAT:    Site config for Bright Angel in Neretva Vallis, Jezero crater: the hero site, readiness level 1.
# IN:      Nothing.
# OUT:     What the pipeline needs to build this site: identity, position, the box, source files with their dates and accuracy, and the rover's stops. Still to add: home and science targets.
# USED BY: pipeline/build_globe.py, and pipeline/build_site.py when the site is built.
# RULES:   No invented coordinates. Every number is copied from the source named beside it.
# TRAPS:   PITFALLS 2, 4.
# OWNER:   Role A, with role C supplying targets.

id: bright-angel
name: Bright Angel
place: Neretva Vallis, Jezero crater
mission: Perseverance
missionYears: "2021 to now"
level: 1
reviewedByPerson: false

position:
  from: point   # the rover stop where Perseverance stood from sol 1210 to sol 1218
  source: "Perseverance waypoints file, stop RMC 56_0, first logged on sol 1210"
  sourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"
  longitudeConvention: "east-positive, -180 to 180"
  latitudeType: planetocentric
  lonEastDeg: 77.305191
  latDeg: 18.497484
  why: >-
    NASA says the Cheyava Falls rock core was collected on 21 July 2024 at the northern edge of
    Neretva Vallis. By our count from the landing date that is sol 1215, and the rover's log has it
    at this stop from sol 1210 until it next moved on sol 1219.
  whySourceUrl: "https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-perseverance-rover-scientists-find-intriguing-mars-rock/"

landing:
  asPublished: "18.44463 N, 77.45089 E: the rover's first logged stop (RMC 3_0, sol 13), before it had driven"
  source: "Perseverance waypoints file"
  sourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"

data:
  - "Image mosaic at 25 cm from HiRISE (USGS)"
  - "Terrain mosaic on a 1 m grid from HiRISE stereo images (USGS); real detail about 3 to 5 m"
  - "Perseverance's own stops, 708 logged to sol 2022, with tilt and height at each"
  - "Rover photographs taken on the ground"

problems:
  - "Home is an assumption for this scenario: the crew rover parks at a rover stop Perseverance reached."

# ---- Hero scenario: home and science targets (pipeline/scenario.py) -------------------------
# Every position is a rover stop, looked up by its id in the waypoints file at build time, so no coordinate is typed
# here. How long Perseverance stayed is counted from the same file: the sols until its next logged stop.

scenario:
  home:
    name: Crew rover
    stop: "50_1618"
    assumed: true
    why: >-
      Assumed for this scenario: the crew's pressurised rover parks where Perseverance itself stood for 16 sols
      (sol 1068 to 1083), on ground the rover's drivers chose and reached, with the rover tilted 8.5 degrees.
    whySourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"
  targets:
    - id: cheyava-falls
      name: Cheyava Falls
      stop: "56_0"
      why: >-
        The rock NASA described as having features that may bear on whether Mars was once home to microscopic life.
        Perseverance cored it on 21 July 2024 at the northern edge of Neretva Vallis.
      whySourceUrl: "https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-perseverance-rover-scientists-find-intriguing-mars-rock/"
    - id: stop-56-3438
      name: Rover stop 56_3438
      stop: "56_3438"
      why: >-
        Perseverance stayed here 13 sols (sol 1231 to 1243), the second-longest stay in this box, so its team found
        enough here to stop and work.
      whySourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"
    - id: stop-59-204
      name: Rover stop 59_204
      stop: "59_204"
      why: >-
        Perseverance stayed here 10 sols (sol 1254 to 1263) on its climb out of the valley, about 108 m above the crew
        rover. The hardest walk of the three.
      whySourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"

# ---- Approach imagery (pipeline/build_approach.py) ------------------------------------------

approach:
  # The near ring around the site: the USGS CTX mosaic that the HiRISE site map was aligned to, so the two meet
  # without a jump. It covers 77.160 to 77.699 E and 18.211 to 18.721 N (read from the file on 14 Nov 2026).
  near:
    file: JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif
    serverPath: raw/jezero
    originalUrl: "https://planetarymaps.usgs.gov/mosaic/mars2020_trn/CTX"
    record:
      # Facts from the product's own metadata file, JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.xml, read 14 Nov 2026.
      # Source images: three CTX stereo pairs, F05_037607/F05_037752, J03_045994/J03_046060 and J21_052811/J22_053233.
      mission: Mars Reconnaissance Orbiter
      instrument: Context Camera (CTX)
      agency: NASA
      productId: JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0
      sourceUrl: "https://doi.org/10.5066/P9GV1ND3"
      doi: "10.5066/P9GV1ND3"
      acquiredFrom: "2006"   # the time period of content the metadata gives
      acquiredTo: "2020"
      published: "2020-07-24"
      gridSpacing: "6 m"
      realDetail: "About 6 m"
      positionAccuracy: "The individual CTX images agree with each other to an average of 9.6 m (product metadata). The HiRISE site map was aligned to this mosaic"
      heightAccuracy: not applicable
      grade: B
      caveats:
        - "For finding your way and seeing the land around the site. Not for planning a walk."
        - "Taken before the rover landed. Rover tracks and hardware are not in it."
        - "Black and white: brightness only, not colour."
      credit: "NASA/JPL-Caltech/MSSS/USGS (Fergason, Galuszka and Hare 2020)"

  # Heights round the site box, so the box no longer stands above flat ground in 3D. Same USGS product family; the
  # HiRISE terrain was aligned to it. Covers the same area as the image above.
  terrain:
    file: JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0.tif
    serverPath: raw/jezero
    originalUrl: "https://planetarymaps.usgs.gov/mosaic/mars2020_trn/CTX"
    sizeKm: 10
    record:
      # From the metadata file JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0.xml, read 14 Nov 2026.
      mission: Mars Reconnaissance Orbiter
      instrument: Context Camera (CTX), stereo
      agency: NASA
      productId: JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0
      sourceUrl: "https://doi.org/10.5066/P9GV1ND3"
      doi: "10.5066/P9GV1ND3"
      acquiredFrom: "2006"
      acquiredTo: "2020"
      published: "2020-07-24"
      gridSpacing: "20 m"
      realDetail: "About 20 m"
      positionAccuracy: "The individual CTX images agree with each other to an average of 9.6 m (product metadata)"
      heightAccuracy: "The CTX terrain models agree with each other to 3.8 m vertically, after the mosaic was shifted 183.3 m to match HRSC (product metadata)"
      grade: B
      caveats:
        - "Only for the 3D shape of the land round the site. Routes and slopes use the 1 m HiRISE terrain inside the box."
        - "Hills and hollows smaller than about 20 m are not in it."
      credit: "NASA/JPL-Caltech/MSSS/USGS (Fergason, Galuszka and Hare 2020)"

# ---- What the pipeline builds --------------------------------------------------------------

box:
  # Centred on the marker position above. The pipeline works out the edges from the Mars radius.
  widthKm: 3
  heightKm: 3

rover:
  # Perseverance's own stops, used to check the terrain against what the rover measured.
  file: m20_perseverance_waypoints.json
  serverPath: raw/feeds
  originalUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"
  heightField: elev_geoid   # metres relative to the areoid, like the terrain mosaic
  # The rover's drives as lines, for the rover path layer.
  pathFile: m20_perseverance_traverse.json
  pathOriginalUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_traverse.json"
  # When sol 0 began at the rover (local mean solar midnight), used to turn sol numbers into Earth dates.
  # Worked out on 14 Nov 2026 from one record of NASA's raw image feed, which gives the same instant three ways:
  # image CCF_1215_0774830009_119ECMUN0560000CACH00200_01_295J was taken on sol 1215 at local mean solar time
  # 20:12:55.968 and at 2024-07-21T10:49:14.311 UTC. 1215.842314 sols of 88,775.244 s before that is this time.
  solZeroStartUtc: "2021-02-18T04:24:20Z"
  record:
    mission: Mars 2020
    instrument: "Perseverance rover: the rover team's own position for each drive"
    agency: NASA
    sourceUrl: "https://mars.nasa.gov/mmgis-maps/M20/Layers/json/M20_waypoints.json"
    credit: "NASA/JPL-Caltech"

sources:
  terrain:
    file: JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif
    serverPath: raw/jezero
    originalUrl: "https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE"
    record:
      mission: Mars Reconnaissance Orbiter
      instrument: HiRISE
      agency: NASA
      productId: JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40
      sourceUrl: "https://astrogeology.usgs.gov/search/map/mars_2020_terrain_relative_navigation_hirise_dtm_mosaic"
      doi: not found
      # Dates of the 12 source images named on the product page, each looked up in the HiRISE
      # catalogue (https://www.uahirise.org/<image id>) on 14 Nov 2026: PSP_002387_1985 is the
      # earliest and ESP_048908_1985 the latest. The paper says 14 images were used; two are not named.
      acquiredFrom: "2007-01-29"
      acquiredTo: "2017-01-01"
      published: "2020-07-24"
      gridSpacing: "1 m"
      realDetail: "About 3 to 5 m"   # docs/CONFIDENCE.md section 6
      positionAccuracy: "Source images agree with each other to better than 3 m (99th percentile) and sit a median 2.1 m from the CTX base map, 95.4% within 6 m (Fergason and others 2020)"
      heightAccuracy: "Median 0.4 m below the CTX terrain mosaic it was aligned to (Fergason and others 2020)"
      grade: B
      caveats:
        - "Rocks, ledges and ripples smaller than about 3 to 5 m are not in this model."
        - "Made from images taken between 2007 and 2017, before the rover landed. Sand may have moved since."
        - "Where two source models meet there can be a small step that is not real."
      credit: "NASA/JPL-Caltech/University of Arizona/USGS (Fergason and others 2020)"
  image:
    file: JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first.tif
    serverPath: raw/jezero
    originalUrl: "https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE"
    record:
      mission: Mars Reconnaissance Orbiter
      instrument: HiRISE
      agency: NASA
      productId: JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first
      sourceUrl: "https://astrogeology.usgs.gov/search/map/mars_2020_terrain_relative_navigation_hirise_orthorectified_image_mosaic"
      doi: not found
      acquiredFrom: "2007-01-29"   # see the note under terrain
      acquiredTo: "2017-01-01"
      published: "2020-07-24"
      gridSpacing: "25 cm"
      realDetail: "About 30 cm in our copy; objects need to be about 1 m across to be recognised"
      positionAccuracy: "Source images agree with each other to better than 3 m (99th percentile) and sit a median 2.1 m from the CTX base map, 95.4% within 6 m (Fergason and others 2020)"
      heightAccuracy: not applicable
      grade: B
      caveats:
        - "Taken between 2007 and 2017, before the rover landed. Rover tracks and hardware are not in it, and sand may have moved."
        - "Lit by the afternoon Sun at the time of each image. Dark patches can be shadows, not dark ground."
        - "One black-and-white band. It shows brightness, not colour."
      credit: "NASA/JPL-Caltech/University of Arizona/USGS (Fergason and others 2020)"
